<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify your code | RecycleConnect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-[#f7fcf9] text-gray-800 min-h-screen">
    <div class="flex min-h-screen flex-col lg:flex-row">

      <!-- SIDEBAR (laptop only) -->
      <aside
        class="hidden lg:block bg-[url('https://res.cloudinary.com/vyomyquu/image/upload/v1791036732/Logos_that_represent_eco-friendliness__ai_aiart_aiartcommunity_aiartwork_aiartist_droppthetea_logodesigner_logodesigns_logodesign_logomark_2_2_wgvztf.png')] bg-no-repeat lg:max-w-[360px] xl:max-w-[460px] w-full border border-[#F2FAF5] rounded-[0_50px_50px_0] shadow-[0_4px_4px_0_rgba(0,0,0,0.25)] bg-[#F2FAF5]"
      >
        <!-- Logo -->
        <div class="mt-47 bg-[#F2FAF5]">
          <div class="flex flex-col justify-center items-center gap-1 p-6">
            <img
              src="https://res.cloudinary.com/vyomyquu/image/upload/v1791036677/RecycleConnect_Logo_icon_1_x603h6.png"
              alt="logo"
              class="max-w-[137px] w-full max-h-[135px] h-full"
            />
            <div class="flex">
              <h2
                class="font-[Montserrat] font-bold text-[28px] text-[#07543E]"
              >
                Recycle
              </h2>
              <span class="font-[Montserrat] text-[28px] text-[#07543E]"
                >Connect</span
              >
            </div>

            <div>
              <ul class="flex gap-8 text-[#07543E]">
                <li>Reduce</li>
                <li>Recycle</li>
                <li>Reuse</li>
              </ul>
            </div>

            <div class="max-w-[159px] w-full text-center mt-6">
              <h2 class="text-[#07543E] font-semibold font-[Inter]">
                A cleaner tomorrow starts with you.
              </h2>
            </div>
          </div>
        </div>

        <!-- LOWER IMAGE -->
        <div class="">
          <img
            src="https://res.cloudinary.com/vyomyquu/image/upload/v1791037531/Logos_that_represent_eco-friendliness__ai_aiart_aiartcommunity_aiartwork_aiartist_droppthetea_logodesigner_logodesigns_logodesign_logomark_1_2_sdj5cz.png"
            alt="Eco-friendly representation image"
            class="w-full max-h-[736px] h-full rounded-[0_0_50px_0]"
          />
        </div>
      </aside>

      <!-- MAIN -->
      <main
        class="min-w-0 flex-1 bg-[#F1F7ED] px-5 py-10 sm:px-10 sm:py-14 lg:px-20 lg:py-16"
      >
        <div
          class="w-full max-w-[600px] mx-auto lg:mx-0 lg:ml-10 flex flex-col"
        >
          <h2
            class="font-bold font-[Inter] text-[28px] sm:text-[32px] lg:text-[36px] leading-tight text-[#07543E]"
          >
            Verify your code
          </h2>
          <p
            class="mt-2 max-w-[420px] font-[Inter] text-base sm:text-lg lg:text-[20px] text-gray-800"
          >
            We sent a 6-digit code to you@gmail.com. Enter it below
          </p>

          <!-- CODE BOXES -->
          <div id="code-group" class="mt-8 sm:mt-10 flex gap-2 sm:gap-4">
            <input
              type="text"
              inputmode="numeric"
              maxlength="1"
              aria-label="Digit 1"
              class="code-box min-w-0 flex-1 max-w-[56px] aspect-square text-center text-xl sm:text-2xl font-bold border border-[#087A55] rounded-lg bg-white outline-none focus:ring-2 focus:ring-[#087A55]"
            />
            <input
              type="text"
              inputmode="numeric"
              maxlength="1"
              aria-label="Digit 2"
              class="code-box min-w-0 flex-1 max-w-[56px] aspect-square text-center text-xl sm:text-2xl font-bold border border-[#087A55] rounded-lg bg-white outline-none focus:ring-2 focus:ring-[#087A55]"
            />
            <input
              type="text"
              inputmode="numeric"
              maxlength="1"
              aria-label="Digit 3"
              class="code-box min-w-0 flex-1 max-w-[56px] aspect-square text-center text-xl sm:text-2xl font-bold border border-[#087A55] rounded-lg bg-white outline-none focus:ring-2 focus:ring-[#087A55]"
            />
            <input
              type="text"
              inputmode="numeric"
              maxlength="1"
              aria-label="Digit 4"
              class="code-box min-w-0 flex-1 max-w-[56px] aspect-square text-center text-xl sm:text-2xl font-bold border border-[#087A55] rounded-lg bg-white outline-none focus:ring-2 focus:ring-[#087A55]"
            />
            <input
              type="text"
              inputmode="numeric"
              maxlength="1"
              aria-label="Digit 5"
              class="code-box min-w-0 flex-1 max-w-[56px] aspect-square text-center text-xl sm:text-2xl font-bold border border-[#087A55] rounded-lg bg-white outline-none focus:ring-2 focus:ring-[#087A55]"
            />
            <input
              type="text"
              inputmode="numeric"
              maxlength="1"
              aria-label="Digit 6"
              class="code-box min-w-0 flex-1 max-w-[56px] aspect-square text-center text-xl sm:text-2xl font-bold border border-[#087A55] rounded-lg bg-white outline-none focus:ring-2 focus:ring-[#087A55]"
            />
          </div>

          <p class="mt-6 text-gray-800 font-[Inter]">
            Don't get it?
            <span class="font-bold text-[#087A55]">Resend in 0:45</span>
          </p>

          <button
            class="mt-10 sm:mt-12 w-full h-[52px] font-[Inter] text-base font-bold bg-[#087A55] text-white rounded-lg cursor-pointer hover:bg-[#066a49] transition-colors"
          >
            Verify Code
          </button>
        </div>
      </main>
    </div>
    <script src="./verify.js"></script>
  </body>
</html>
