<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Household request Pickup</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="script.js" defer></script>
  </head>
  <body class="bg-[hsl(146,41%,97%)]">
    <div class="relative flex">
      <aside
        class="relative flex flex-col flex-1 gap-12 md:px-7 md:py-5 min-h-screen before:content-[''] before:absolute before:inset-0 before:bg-[hsl(146,44%,94%)] before:-z-20 after:content[''] after:absolute after:inset-0 after:bg-no-repeat after:bg-[length:600px] after:bg-[height:100px] after:bg[position:80px_top] after:bg-[url('https://res.cloudinary.com/pftvcaqk/image/upload/v1790676031/Logos_that_represent_eco-friendliness__ai_aiart_aiartcommunity_aiartwork_aiartist_droppthetea_logodesigner_logodesigns_logodesign_logomark_2_xylfqu.png')] after:-z-10 after:pointer-events-none"
      >
        <div class="flex gap-2 relative z-10">
          <img
            src="https://res.cloudinary.com/pftvcaqk/image/upload/v1790676031/RecycleConnect_Logo_icon_1_psu1u5.png"
            alt="Recycle-connect-logo"
            class="w-8 h-8"
          />
          <h1 class="text-[hsl(163,53%,26%)] text-xl">
            <strong class="font-bold">Recycle</strong>Connect
          </h1>
        </div>
        <nav class="flex flex-col font-[500] text-[hsl(163,53%,26%)] gap-6">
          <div class="flex items-center">
            <img
              src="https://res.cloudinary.com/pftvcaqk/image/upload/v1790676031/Group_3_d9tfgk.png"
              alt="home-img"
              class="w-4 h-4"
            />
            <p class="px-5 text-sm">Home</p>
          </div>
          <div class="flex items-center">
            <img
              src="https://res.cloudinary.com/pftvcaqk/image/upload/v1790676031/Vector_7_tlfhk8.png"
              alt="request-img"
              class="h-4 w-4"
            />
            <p class="px-5 text-sm">Request Pickup</p>
          </div>
          <div class="flex items-center">
            <img
              src="https://res.cloudinary.com/pftvcaqk/image/upload/v1790676032/Vector_8_gamkmf.png"
              alt="history-img"
              class="w-4 h-4"
            />
            <p class="px-5 text-sm">History</p>
          </div>
          <div class="flex items-center">
            <img
              src="https://res.cloudinary.com/pftvcaqk/image/upload/v1790676032/Group_2_vepo5f.png"
              alt="reward-img"
              class="h-4 w-4"
            />
            <p class="px-5 text-sm">Reward</p>
          </div>
          <div class="flex items-center">
            <img
              src="https://res.cloudinary.com/pftvcaqk/image/upload/v1790676031/Vector_9_k0etbg.png"
              alt="profile-img"
              class="w-4 h-4"
            />
            <p class="px-5 text-sm">Profile</p>
          </div>
        </nav>
      </aside>
      <main class="flex flex-3">
        <!-- Rquest area -->

        <section class="flex-[1.5] pt-20">
          <div class="mb-6">
            <h1 class="text-2xl font-bold">Request Pickup</h1>
            <p class="text-sm">Choose the material(s) you want to recycle.</p>
          </div>
          <div class="grid grid-cols-3 gap-3 px-1">
            <div
              class="flex flex-col h-[130px] w-[130px] rounded-xl shadow-sm bg-white items-center justify-center gap-2 border-1 border-[hsl(150,19%,88%)] hover:bg-[hsl(146,44%,94%)]"
            >
              <img
                src="https://res.cloudinary.com/pftvcaqk/image/upload/v1790676033/Group_vnbhb6.png"
                alt="plastic-img"
                class="w-8 h-8 md:w-9 md:h-9 object-contain"
              />
              <p class="text-sm font-[500]">Plastic</p>
            </div>
            <div
              class="flex flex-col h-[130px] w-[130px] rounded-xl shadow-sm bg-white items-center justify-center gap-2 border-1 border-[hsl(150,19%,88%)] hover:bg-[hsl(146,44%,94%)]"
            >
              <img
                src="https://res.cloudinary.com/pftvcaqk/image/upload/v1790676033/Vector_mc2l36.png"
                alt="plastic-img"
                class="w-8 h-8 md:w-9 md:h-9 object-contain"
              />
              <p class="text-sm font-[500]">Paper</p>
            </div>
            <div
              class="flex flex-col h-[130px] w-[130px] rounded-xl shadow-sm bg-white items-center justify-center gap-2 border-1 border-[hsl(150,19%,88%)] hover:bg-[hsl(146,44%,94%)]"
            >
              <img
                src="https://res.cloudinary.com/pftvcaqk/image/upload/v1790676033/emojione-v1_oil-drum_yfnegm.png"
                alt="plastic-img"
                class="w-8 h-8 md:w-9 md:h-9 object-contain"
              />
              <p class="text-sm font-[500]">Metal</p>
            </div>
            <div
              class="flex flex-col h-[130px] w-[130px] rounded-xl shadow-sm bg-white items-center justify-center gap-2 border-1 border-[hsl(150,19%,88%)] hover:bg-[hsl(146,44%,94%)]"
            >
              <img
                src="https://res.cloudinary.com/pftvcaqk/image/upload/v1790676033/Vector_1_nasga7.png"
                alt="plastic-img"
                class="w-8 h-8 md:w-9 md:h-9 object-contain"
              />
              <p class="text-sm font-[500]">Glass</p>
            </div>
            <div
              class="flex flex-col h-[130px] w-[130px] rounded-xl shadow-sm bg-white items-center justify-center gap-2 border-1 border-[hsl(150,19%,88%)] hover:bg-[hsl(146,44%,94%)]"
            >
              <img
                src="https://res.cloudinary.com/pftvcaqk/image/upload/v1790676032/Vector_2_wbozty.png"
                alt="plastic-img"
                class="w-8 h-8 md:w-9 md:h-9 object-contain"
              />
              <p class="text-sm font-[500]">E-waste</p>
            </div>
            <div
              class="flex flex-col h-[130px] w-[130px] rounded-xl shadow-sm bg-white items-center justify-center gap-2 border-1 border-[hsl(150,19%,88%)] hover:bg-[hsl(146,44%,94%)]"
            >
              <img
                src="https://res.cloudinary.com/pftvcaqk/image/upload/v1790676032/Group_1_supxpn.png"
                alt="plastic-img"
                class="w-8 h-8 md:w-9 md:h-9 object-contain"
              />
              <p class="text-sm font-[500]">Others</p>
            </div>
          </div>
          <div><img src="" alt="" /> Remember me</div>
        </section>

        <!-- Pickup area -->

        <section class="flex-[1.5]">
          <!-- Top -->
          <header class="flex justify-end items-center gap-4 pr-10 pt-4">
            <button aria-label="Notifications">
              <img
                src="https://res.cloudinary.com/pftvcaqk/image/upload/v1790692838/Group_80_ukkpob.png"
                alt="bell-img"
              />
            </button>
            <img
              src="https://res.cloudinary.com/pftvcaqk/image/upload/v1790676032/Ellipse_8_efpgpl.png"
              alt="lillian-img"
              class="w-8 h-8 rounded-full"
            />
            <span class="text-sm">Lillian</span>
            <img
              src="https://res.cloudinary.com/pftvcaqk/image/upload/v1790676032/Vector_4_caszaf.png"
              alt="drop-down-img"
            />
          </header>
          <!-- bottom -->
          <div class="flex flex-col gap-2 pt-25 pr-5">
            <h2 class="text-xl font-bold">Pickup Location</h2>
            <div
              class="flex w-[300px] h-[40px] bg-white rounded-xl shadow-sm border-1 border-[hsl(150,19%,88%)] items-center pl-4 gap-2"
            >
              <img
                src="https://res.cloudinary.com/pftvcaqk/image/upload/v1790676032/basil_location-solid_n6aiuh.png"
                alt="location-img"
                class="w-5 h-5"
              />
              <p class="text-[hsl(163,53%,26%)] text-base font-[600]">
                12 Greenview Estate, Lagos
              </p>
            </div>
            <img
              src="https://res.cloudinary.com/pftvcaqk/image/upload/v1790693537/City_map_to_navigate_on_route___Premium_Vector_1_gcjvew.png"
              alt="map-img"
              class="h-[200px]"
            />
            <div class="flex text-base font-[600]">
              <img
                src="https://res.cloudinary.com/pftvcaqk/image/upload/v1790676032/basil_location-solid_n6aiuh.png"
                alt="location-img"
                class="w-[26px] h-[31px]"
              />Use my current location
            </div>
            <button
              class="bg-[hsl(161,88%,25%)] w-full max-w-[590px] h-[40px] rounded-[13px] text-white text-base font-semi-bold"
            >
              Next
            </button>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
