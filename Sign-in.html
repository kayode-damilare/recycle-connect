<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
        <title>RecycleConnect Sign-in</title>
    </head>
    <body class="bg-[hsl(142,44%,96%)] flex justify-center items-center min-h-screen font-['Inter',sans-serif]">
        <div class="flex items-stretch w-full min-h-[640px] bg-[hsl(142,44%,96%)] rounded-[20px] max-[768px]:flex-col">
            <div class="relative flex flex-col items-center text-center grow-0 shrink-0 basis-[36%] overflow-hidden rounded-[50px] bg-[hsl(142,44%,96%)] shadow-[0_4px_4px_rgba(0,0,0,0.25)] max-[768px]:pt-10 max-[768px]:px-6 max-[768px]:pb-0 max-[768px]:min-h-[320px]">
                <div class="flex justify-center items-center w-full h-[85px] overflow-hidden shrink-0">
                    <img src="https://res.cloudinary.com/oo2ddlek/image/upload/v1790883054/f4ab1007fa8460ba7f38126d8bfdb5cdd5134ed9_nuawh7.jpg" alt="logo-watermark" class="w-full h-full object-cover object-top opacity-10 pointer-events-none">
                </div>

                <div class="relative z-[1] px-5 mt-4">
                    <img src="https://res.cloudinary.com/oo2ddlek/image/upload/v1790715284/fe1a3e9445108f7b67cbddb8b1f19ae4a5d3911f_f0so5l.png" alt="RecycleConnect logo" class="block w-[110px] h-[110px] object-contain rounded-full mx-auto mb-[10px]">
                    <h1 class="text-[hsl(163,85%,18%)] text-2xl font-normal tracking-[-0.3px] font-['Montserrat',sans-serif]"><strong class="font-extrabold">Recycle</strong><span>Connect</span></h1>
                    <p class="text-[hsl(163,85%,18%)] text-xs font-normal mt-1">Reduce &bull; Recycle &bull; Reuse</p>
                </div>

                <div class="relative z-[1] px-5 mt-5 text-[hsl(163,85%,18%)] text-base font-semibold leading-none">
                    <p>A Cleaner tomorrow, <br>starts with you.</p>
                </div>

                <div class="w-full h-[340px] overflow-hidden shrink-0 mt-auto">
                    <img src="https://res.cloudinary.com/oo2ddlek/image/upload/v1790883054/f4ab1007fa8460ba7f38126d8bfdb5cdd5134ed9_nuawh7.jpg" alt="Eco logo" class="block w-full h-full object-cover object-top scale-[1.34] origin-top">
                </div>
            </div>

            <div class="flex flex-col flex-1 py-12 px-16 bg-[hsl(142,44%,96%)] max-[768px]:py-10 max-[768px]:px-6">
                <div class="flex gap-2.5 mb-9">
                    <button class="household-btn flex-1 py-2.5 px-4 bg-[hsl(161,88%,25%)] rounded-xl font-semibold text-white text-xl cursor-pointer transition-all duration-250">Household</button>
                    <button class="collector-btn flex-1 py-2.5 px-4 border-2 border-[hsl(148,20%,87%)] bg-[hsl(146,44%,94%)] rounded-xl font-semibold text-[hsl(163,85%,18%)] text-xl cursor-pointer transition-all duration-250">Collector</button>
                </div>

                <div class="mb-7">
                    <h2 class="text-black text-[28px] font-bold mb-1.5">Welcome Back</h2>
                    <p class="text-[hsl(240,3%,69%)] text-lg font-bold">Log in to your account to continue</p>
                </div>

                <form id="login-form">

                    <!-- EMAIL ADDRESS -->
                    <div class="mb-[18px]">
                        <label for="email" class="block mb-[7px] text-[hsl(240,3%,69%)] text-xl font-bold">
                            Email address
                        </label>

                        <div class="relative flex items-center">
                            <i class="fa-solid fa-envelope absolute left-3.5 text-[#8E8E93] text-base"></i>

                            <input
                                type="email"
                                id="email"
                                placeholder="Email address"
                                class="w-full py-[13px] pr-3.5 pl-[42px] border border-[hsl(148,20%,87%)] rounded-xl text-xs outline-none bg-white text-[hsl(0,2%,53%)] placeholder:text-[hsl(0,2%,53%)]"
                            >
                        </div>
                    </div>


                    <!-- PASSWORD -->
                    <div class="mb-[18px]">
                        <label for="password" class="block mb-[7px] text-[hsl(240,3%,69%)] text-xl font-bold">
                            Password
                        </label>

                        <div class="relative flex items-center">
                            <i class="fa-solid fa-lock absolute left-3.5 text-[#8E8E93] text-base"></i>

                            <input
                                type="password"
                                id="password"
                                placeholder="Password"
                                class="w-full py-[13px] pr-11 pl-[42px] border border-[hsl(148,20%,87%)] rounded-xl text-xs outline-none bg-white text-[hsl(0,2%,53%)] placeholder:text-[hsl(0,2%,53%)]"
                            >

                            <button
                                type="button"
                                id="toggle-password"
                                class="absolute right-3 flex items-center justify-center text-[#087A55] cursor-pointer"
                                aria-label="Show password"
                            >
                                <i class="fa-solid fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="text-right mb-6 -mt-1.5">
                        <a href="#" class="text-[hsl(161,88%,25%)] no-underline text-xs font-semibold">Forgot Password?</a>
                    </div>

                    <button type="submit" class="submit-btn w-full p-3.5 bg-[hsl(161,88%,25%)] text-white rounded-[10px] text-base font-bold cursor-pointer transition-colors duration-250 hover:bg-[hsl(160,88%,20%)]">Log In</button>

                    <div class="flex items-center text-center my-6 text-[hsl(0,2%,53%)] text-xl before:flex-1 before:border-b before:border-[hsl(0,2%,53%)] after:flex-1 after:border-b after:border-[hsl(0,2%,53%)]">
                        <span class="px-3.5">or continue with</span>
                    </div>

                    <div class="flex justify-center gap-3 mb-7">
                        <button onclick="alert('This option is under construction')" type="button" class="flex min-w-[50px] justify-center items-center h-12 border border-[hsl(148,20%,87%)] rounded-[10px] bg-white cursor-pointer transition-all duration-200 hover:border-[hsl(161,88%,25%)] hover:bg-[hsl(150,50%,96%)]"><img src="https://res.cloudinary.com/oo2ddlek/image/upload/v1790882398/devicon_google_ljmnce.png" alt="Google" class="w-[22px] h-[22px] object-contain"></button>
                    </div>

                    <div class="text-center text-xl font-bold text-[hsl(158,19%,11%)]">
                        <p>Don't have an account? <a href="Sign-Up.html" class="text-[hsl(161,88%,25%)] no-underline">Sign up</a></p>
                    </div>
                </form>
            </div>
        </div>

        <script src="house-sign-in.js"></script>
    </body>
</html>
