<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <title>Sign-Up Page</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-[#F2FAF5] flex flex-col">

  <!-- NAV BAR -->

  <header class="bg-white h-[64px] px-30 py-2 shadow-[0_4px_4px_rgba(0,0,0,0.05)] w-full fixed">
    <div class="flex justify-between items-center">
      <div class="flex items-center font-['Montserrat'] text-[#077053] text-14px">
        <img src="https://res.cloudinary.com/vyomyquu/image/upload/v1790626204/RecycleConnect_Logo_1_dq4b8w.png" alt="Recycle-Connect-Logo" class="w-[48px] h-[42px]">
        <h2 class="font-bold">Recycle</h2><span class="">Connect</span>
      </div>
      
      <div class="">
        <ul class="flex gap-16 text-[#043C2D] font-bold leading-0">
          <li><a href="#how-it-works">How It Works</a></li>
          <li><a href="#about">About US</a></li>
          <li><a href="">For Collection</a></li>
          <li><a href="">Contact</a></li>
        </ul>
      </div>

      <div class="">
        <button class="inline-flex justify-center items-center h-[38px] gap-1 bg-[#087a55] p-1 rounded-[40px] max-w-full w-[156px] text-[#FEF9F9] font-bold cursor-pointer">
          <span><a href="Sign-Up.html">Get Started</a></span><img src="https://res.cloudinary.com/vyomyquu/image/upload/v1790626965/arrow-right_mdgbqy.svg" class="w-5">
        </button>
      </div>
    </div>
  </header>


  <div class="flex">

  
   <aside class="bg-[url('https://res.cloudinary.com/vyomyquu/image/upload/v1791036732/Logos_that_represent_eco-friendliness__ai_aiart_aiartcommunity_aiartwork_aiartist_droppthetea_logodesigner_logodesigns_logodesign_logomark_2_2_wgvztf.png')] bg-no-repeat max-w-[460px] w-full border border-[#F2FAF5] rounded-[0_50px_50px_0] shadow-[0_4px_4px_0_rgba(0,0,0,0.25)] bg-[#F2FAF5]">

    <!-- Logo -->

     <div class="mt-47 bg-[#F2FAF5]">
      <div class="flex flex-col justify-center items-center gap-1 p-6">
        <img src="https://res.cloudinary.com/vyomyquu/image/upload/v1791036677/RecycleConnect_Logo_icon_1_x603h6.png" alt="logo" class="max-w-[137px] w-full max-h-[135px] h-full">
        <div class="flex">
          <h2 class="font-[Montserrat] font-bold text-[28px] text-[#07543E]">Recycle</h2>
          <span class="font-[Montserrat] text-[28px] text-[#07543E]">Connect</span>
        </div>
        
        <div>
          <ul class="flex gap-8 text-[#07543E]">
            <li>Reduce</li>
            <li>Recycle</li>
            <li>Reuse</li>
          </ul>
        </div>

        <div class="max-w-[159px] w-full text-center mt-6">
          <h2 class="text-[#07543E] font-semibold font-[Inter]">A cleaner tomorrow starts with you.</h2>
        </div>
        
      </div>
     </div>

     <!-- LOWER IMAGE -->

     <div class="">
      <img src="https://res.cloudinary.com/vyomyquu/image/upload/v1791037531/Logos_that_represent_eco-friendliness__ai_aiart_aiartcommunity_aiartwork_aiartist_droppthetea_logodesigner_logodesigns_logodesign_logomark_1_2_sdj5cz.png" alt="Eco-friendly representation image" class="w-full max-h-[736px] h-full rounded-[0_0_50px_0]">
     </div>
     
  </aside>

  <!-- MAIN CONTENT -->

   <main class="p-12 flex flex-col gap-2 bg-[#F2FAF5] w-full">
  <div class="mt-20">

    
    <h1 class="font-[Inter] font-bold text-[40px]">
      Create Your Account
    </h1>
    <p class="font-[Inter] text-[18px] text-[#07543E]">
      Start your journey towards a greener tomorrow today!
    </p>

    <!-- FORM  -->

    <form id="signup-form" class="flex flex-col gap-4 mt-4">

      <!-- NAME -->

      <input type="text" id="name" name="fullName" placeholder="Full Name" required class="border border-[#D8E5DE] rounded-[12px] px-4 max-w-[729px] w-full max-h-[50px] h-screen focus:outline-none focus:border-[2px] focus:border-[#087A55]">

      <!-- EMAIL -->

      <input type="email" name="email" id="e-mail" placeholder="Email Address" required class="border border-[#D8E5DE] rounded-[12px] px-4 max-w-[729px] w-full max-h-[50px] h-screen focus:outline-none focus:border-[2px] focus:border-[#087A55]">

      <!-- PHONE NUMBER -->

      <input type="tel" name="phone" id="phone" placeholder="Phone Number" minlength="11" required class="border border-[#D8E5DE] rounded-[12px] px-4 max-w-[729px] w-full max-h-[50px] h-screen focus:outline-none focus:border-[2px] focus:border-[#087A55]">

      <!-- PASSWORD -->

      <div class="relative ">
        <input type="password" name="password" id="password" minlength="8" placeholder="Password" required class="border border-[#D8E5DE] rounded-[12px] px-4 max-w-[729px] w-full max-h-[50px] h-screen focus:outline-none focus:border-[2px] focus:border-[#087A55]">

        <button type="button" class="toggle-password absolute right-4 top-1/2 -translate-y-1/2 text-[#087A55] cursor-pointer" data-target="password" aria-label="Show password" >

          <i class="fa-regular fa-eye" ></i>

        </button>
      </div>
      

      <!-- CONFIRM PASSWORD -->

      <div class="relative">
        <input type="password" name="confirmPassword" id="confirm-pass" placeholder="Confirm Password" minlength="8" required class="border border-[#D8E5DE] rounded-[12px] px-4 max-w-[729px] w-full max-h-[50px] h-screen focus:outline-none focus:border-[2px] focus:border-[#087A55]">

        <button type="button" class="toggle-password absolute right-4 top-1/2 -translate-y-1/2 text-[#087A55] cursor-pointer" data-target="confirm-pass" aria-label="Show password">

          <i class="fa-regular fa-eye"></i>

        </button>
      </div>
      

      <!-- TERMS AND CONDITIONS -->

      <div>
        <input type="checkbox" name="agree" id="terms-condition" required class=" checked:accent-[#087A55] ring-[#087A55] border border-[#087A55] h-3 w-3 ">
        <label for="terms-condition" class="text-[#087A55]">I Agree to the Terms & Conditions and Privacy Policy</label>
      </div>

      <!-- MESSAGE AREA  -->

      <p id="signup-message" role="status" aria-live="polite"></p>

          <!-- CREATE ACCOUNT BUTTON  -->
         
      <div class="mt-6">
        <button id="signup-button" class="flex justify-center items-center bg-[#087A55] w-full text-white h-[68px] font-[Inter] font-semibold rounded-[12px] cursor-pointer" type="submit" >
        Create Account
        </button>
    </div>
    </form>

    <!-- GOOGLE LOGIN -->

    <div class="flex flex-col items-center">
      <div class="flex justify-center items-center gap-3 text-center text-[#043C2D] font-[Inter] mt-6">
        <img src="https://res.cloudinary.com/vyomyquu/image/upload/v1791662180/Line_1_1_xhymdp.png">
        <span>or continue with</span>
        <img src="https://res.cloudinary.com/vyomyquu/image/upload/v1791662180/Line_1_1_xhymdp.png">
      </div>

      <div class="flex justify-center mt-4 w-[81px] h-[68px] items-center">
        <img onclick="alert('Option still under construction')" src="https://res.cloudinary.com/vyomyquu/image/upload/v1791662415/Group_139_x3tsmp.png">
      </div>
    </div>



    <!-- SIGN IN  -->

    <div class="flex justify-center mt-8 font-bold text-[20px] font-[Inter] font-[#087A55]">
      <h2 >Already have an account? <a href="Sign-in.html" class="text-[#087A55]">Sign In</a></h2>
    </div>
    </div>
  </main>

  </div>

  <script src="signup.js"></script>
</body>
</html>
