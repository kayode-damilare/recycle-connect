        </div>

            alt="Eco-friendly representation image"
            class="w-full max-h-[736px] h-full rounded-[0_0_50px_0]"
          />
        </div>

      <!-- Header -->

            <p

            <p class="mt-6 text-grey-800 font-[Inter]">
              Don't get it?
              <span class="font-bold text-[#087A55]">Resend in 0:45</span>
            </p>
            <button
              class="mt-12 w-full h-[52px] font-[Inter] font-[28px] bg-[#087A55] text-white font-bold rounded-lg cursor-pointer"

              Verify Code
