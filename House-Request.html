<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Household request Pickup</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="House-Request.js" defer></script>
  </head>

  <body class="bg-[hsl(146,41%,97%)] font-['Inter']">
    <!-- Side-bar -->

    <div class="relative flex">
      <aside
        class="relative flex flex-col flex-1 gap-12 md:px-7 md:py-5 min-h-screen max-h-full before:content-[''] before:absolute before:inset-0 before:bg-[hsl(146,44%,94%)] before:-z-20 after:content[''] after:absolute after:inset-y-0 after:-right-20 after:bg-no-repeat after:w-[130%] after:bg-h-full after:bg[position:80px_top] after:bg-[url('https://res.cloudinary.com/pftvcaqk/image/upload/v1790676031/Logos_that_represent_eco-friendliness__ai_aiart_aiartcommunity_aiartwork_aiartist_droppthetea_logodesigner_logodesigns_logodesign_logomark_2_xylfqu.png')] after:-z-10 after:pointer-events-none after:bg-overflow-visible"
      >
        <div class="flex gap-2 relative z-10">
          <img
            src="https://res.cloudinary.com/pftvcaqk/image/upload/v1790676031/RecycleConnect_Logo_icon_1_psu1u5.png"
            alt="Recycle-connect-logo"
            class="w-8 h-8"
          />
          <h1
            class="text-[hsl(163,53%,26%)] text-[28px] font-[400] font-['Montserrat']"
          >
            <strong class="font-[700]">Recycle</strong>Connect
          </h1>
        </div>

        <!-- nav-links -->

        <nav
          class="flex flex-col font-[600] pt-[50px] text-[hsl(163,53%,26%)] gap-2"
        >
          <div
            class="flex items-center w-[330px] h-[55px] rounded-[12px] hover:border-[0.5px] hover:shadow-[hsl(161,88%,25%)] hover:shadow-lg cursor-pointer hover:border-[hsl(148,20%,87%)] pl-3"
          >
            <img
              src="https://res.cloudinary.com/pftvcaqk/image/upload/v1790676031/Group_3_d9tfgk.png"
              alt="home-img"
              class="w-4 h-4"
            />
            <p class="px-5 text-base">Home</p>
          </div>
          <div
            class="flex items-center w-[330px] h-[55px] rounded-[12px] hover:border-[0.5px] hover:shadow-[hsl(161,88%,25%)] hover:shadow-lg cursor-pointer hover:border-[hsl(148,20%,87%)] pl-3"
          >
            <img
              src="https://res.cloudinary.com/pftvcaqk/image/upload/v1790676031/Vector_7_tlfhk8.png"
              alt="request-img"
              class="h-4 w-4"
            />
            <p class="px-5 text-base">Request Pickup</p>
          </div>
          <div
            class="flex items-center w-[330px] h-[55px] rounded-[12px] hover:border-[0.5px] hover:shadow-[hsl(161,88%,25%)] hover:shadow-lg cursor-pointer hover:border-[hsl(148,20%,87%)] pl-3"
          >
            <img
              src="https://res.cloudinary.com/pftvcaqk/image/upload/v1790676032/Vector_8_gamkmf.png"
              alt="history-img"
              class="w-4 h-4"
            />
            <p class="px-5 text-base">History</p>
          </div>
          <div
            class="flex items-center w-[330px] h-[55px] rounded-[12px] hover:border-[0.5px] hover:shadow-[hsl(161,88%,25%)] hover:shadow-lg cursor-pointer hover:border-[hsl(148,20%,87%)] pl-3"
          >
            <img
              src="https://res.cloudinary.com/pftvcaqk/image/upload/v1790676032/Group_2_vepo5f.png"
              alt="reward-img"
              class="h-4 w-4"
            />
            <p class="px-5 text-base">Reward</p>
          </div>
          <div
            class="flex items-center w-[330px] h-[55px] rounded-[12px] hover:border-[0.5px] hover:shadow-[hsl(161,88%,25%)] hover:shadow-lg cursor-pointer hover:border-[hsl(148,20%,87%)] pl-3"
          >
            <img
              src="https://res.cloudinary.com/pftvcaqk/image/upload/v1790676031/Vector_9_k0etbg.png"
              alt="profile-img"
              class="w-4 h-4"
            />
            <p class="px-5 text-base">Profile</p>
          </div>
        </nav>
      </aside>

      <main class="flex flex-3">
        <!-- Rquest area -->

        <section class="flex-[1.5] pt-[128px] pl-1 pr-2">
          <div class="mb-6">
            <h1 class="text-[40px] font-[700]">Request Pickup</h1>
            <p class="text-base font-[600] text-[hsl(163,53%,26%)]">
              Choose the material(s) you want to recycle.
            </p>
          </div>
          <div class="grid grid-cols-3 gap-3 gap-y-10">
            <div
              class="flex flex-col h-[130px] w-[130px] rounded-xl shadow-sm bg-white items-center justify-center gap-2 border-1 border-[hsl(150,19%,88%)] hover:border-2 hover:border-[hsl(161,88%,25%)] hover:bg-[hsl(146,44%,94%)]"
            >
              <img
                src="https://res.cloudinary.com/pftvcaqk/image/upload/v1790676033/Group_vnbhb6.png"
                alt="plastic-img"
                class="w-8 h-8 md:w-12 md:h-12 object-contain"
              />
              <p class="text-base font-[600]">Plastic</p>
            </div>
            <div
              class="flex flex-col h-[130px] w-[130px] rounded-xl shadow-sm bg-white items-center justify-center gap-2 border-1 border-[hsl(150,19%,88%)] hover:border-2 hover:border-[hsl(161,88%,25%)] hover:bg-[hsl(146,44%,94%)]"
            >
              <img
                src="https://res.cloudinary.com/pftvcaqk/image/upload/v1790676033/Vector_mc2l36.png"
                alt="paper-img"
                class="w-8 h-8 md:w-12 md:h-12 object-contain"
              />
              <p class="text-base font-[600]">Paper</p>
            </div>
            <div
              class="flex flex-col h-[130px] w-[130px] rounded-xl shadow-sm bg-white items-center justify-center gap-2 border-1 border-[hsl(150,19%,88%)] hover:border-2 hover:border-[hsl(161,88%,25%)] hover:bg-[hsl(146,44%,94%)]"
            >
              <img
                src="https://res.cloudinary.com/pftvcaqk/image/upload/v1790676033/emojione-v1_oil-drum_yfnegm.png"
                alt="metal-img"
                class="w-8 h-8 md:w-12 md:h-12 object-contain"
              />
              <p class="text-base font-[600]">Metal</p>
            </div>
            <div
              class="flex flex-col h-[130px] w-[130px] rounded-xl shadow-sm bg-white items-center justify-center gap-2 border-1 border-[hsl(150,19%,88%)] hover:border-2 hover:border-[hsl(161,88%,25%)] hover:bg-[hsl(146,44%,94%)]"
            >
              <img
                src="https://res.cloudinary.com/pftvcaqk/image/upload/v1790676033/Vector_1_nasga7.png"
                alt="glass-img"
                class="w-8 h-8 md:w-12 md:h-12 object-contain"
              />
              <p class="text-base font-[600]">Glass</p>
            </div>
            <div
              class="flex flex-col h-[130px] w-[130px] rounded-xl shadow-sm bg-white items-center justify-center gap-2 border-1 border-[hsl(150,19%,88%)] hover:border-2 hover:border-[hsl(161,88%,25%)] hover:bg-[hsl(146,44%,94%)]"
            >
              <img
                src="https://res.cloudinary.com/pftvcaqk/image/upload/v1790676032/Vector_2_wbozty.png"
                alt="desktop-img"
                class="w-8 h-8 md:w-12 md:h-12 object-contain"
              />
              <p class="text-base font-[600]">E-waste</p>
            </div>
            <div
              class="flex flex-col h-[130px] w-[130px] rounded-xl shadow-sm bg-white items-center justify-center gap-2 border-1 border-[hsl(150,19%,88%)] hover:border-2 hover:border-[hsl(161,88%,25%)] hover:bg-[hsl(146,44%,94%)]"
            >
              <img
                src="https://res.cloudinary.com/pftvcaqk/image/upload/v1790676032/Group_1_supxpn.png"
                alt="leaf-img"
                class="w-8 h-8 md:w-12 md:h-12 object-contain"
              />
              <p class="text-base font-[600]">Others</p>
            </div>
          </div>
          <div
            class="flex text-[hsl(163,53%,26%)] text-base font-[600] px-7 h-[132px] w-full max-w-[510px] gap-1 shadow-lg mt-[120px] pt-4 bg-[hsl(146,44%,94%)]"
          >
            <img
              src="https://res.cloudinary.com/pftvcaqk/image/upload/v1790676031/Vector_6_l6ebj2.png"
              alt="img"
              class="w-5 h-5 object-contain"
            />
            <span>Remember me</span>
          </div>
        </section>

        <!-- Pickup area -->

        <section class="flex-[1.5] pl-4 mr-4">
          <!-- Top -->

          <header class="flex justify-end items-center gap-4 pr-4 pt-4">
            <button aria-label="Notifications">
              <img
                src="https://res.cloudinary.com/pftvcaqk/image/upload/v1790692838/Group_80_ukkpob.png"
                alt="bell-img"
              />
            </button>
            <img
              src="https://res.cloudinary.com/pftvcaqk/image/upload/v1790676032/Ellipse_8_efpgpl.png"
              alt="lillian-img"
              class="w-8 h-8 rounded-full"
            />
            <span class="text-base text-[hsl(163,53%,26%)] font-[400]"
              >Lillian</span
            >
            <img
              src="https://res.cloudinary.com/pftvcaqk/image/upload/v1790676032/Vector_4_caszaf.png"
              alt="drop-down-img"
            />
          </header>

          <!-- bottom -->

          <div class="flex flex-col gap-2 pt-[172px]">
            <h2 class="text-[32px] font-[700]">Pickup Location</h2>
            <div
              class="flex w-[330px] h-[58px] bg-white rounded-xl shadow-sm border-1 border-[hsl(150,19%,88%)] items-center pl-4 gap-2"
            >
              <img
                src="https://res.cloudinary.com/pftvcaqk/image/upload/v1790676032/basil_location-solid_n6aiuh.png"
                alt="location-img"
                class="w-5 h-5"
              />
              <p class="text-[hsl(163,53%,26%)] text-base font-[600]">
                12 Greenview Estate, Lagos
              </p>
            </div>
            <img
              src="https://res.cloudinary.com/pftvcaqk/image/upload/v1790693537/City_map_to_navigate_on_route___Premium_Vector_1_gcjvew.png"
              alt="map-img"
              class="h-[257px] w-full"
            />
            <div
              class="flex text-[hsl(163,53%,26%)] text-base font-[600] items-center"
            >
              <img
                src="https://res.cloudinary.com/pftvcaqk/image/upload/v1790676032/basil_location-solid_n6aiuh.png"
                alt="location-img"
                class="w-[26px] h-[31px] object-contain"
              />Use my current location
            </div>
            <a
              href="/Schedule-Pick.html"
              class="flex bg-[hsl(161,88%,25%)] mt-14 w-full max-w-[509px] h-[60px] rounded-[13px] text-white text-base font-semi-bold items-center justify-center"
            >
              Next
            </a>
          </div>
        </section>
      </main>
    </div>

</html>
