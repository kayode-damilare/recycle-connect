<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="shortcut icon" href="https://res.cloudinary.com/vyomyquu/image/upload/v1790626204/RecycleConnect_Logo_1_dq4b8w.png" type="image/x-icon">
  <title>Collector Sign-Up</title>
</head>
<body>
  <div class="bg-[url('https://res.cloudinary.com/vyomyquu/image/upload/v1790793624/Logos_that_represent_eco-friendliness__ai_aiart_aiartcommunity_aiartwork_aiartist_droppthetea_logodesigner_logodesigns_logodesign_logomark_2_1_sjnxmr.png')] bg-no-repeat">

  
    <aside class="max-w-[374px] w-full h-screen bg-[#E8F6EE] p-6 ">

      <!-- LOGO -->

      <div class="flex items-center">
        <img src="https://res.cloudinary.com/vyomyquu/image/upload/v1790626204/RecycleConnect_Logo_1_dq4b8w.png" alt="Recycle Connect logo">
        <h2>Recycle</h2>
        <span>Connect</span>
      </div>

      <!-- BUTTONS -->
      <div class="mt-18">
        <ul class="flex flex-col gap-6">
          <li class="flex gap-2 items-center"><img src="https://res.cloudinary.com/vyomyquu/image/upload/v1790784302/Group_1_h4envp.png" class="max-w-[23px] w-full" ><span>Home</span></li>

          <li class="flex gap-2"><img src="https://res.cloudinary.com/vyomyquu/image/upload/v1790784302/boxicons_pickup-truck_mhaoya.png" class="max-w-[24px] w-full"><span>Request Pickup</span></li>

          <li class="flex gap-4"><img src="https://res.cloudinary.com/vyomyquu/image/upload/v1790793348/Group_2_fdnpvu.png" class="max-w-[12px] w-full"><span>Become A Collector</span></li>

          <li class="flex"><img src="https://res.cloudinary.com/vyomyquu/image/upload/v1790784302/Group_71_hjvsub.png" class="max-w-[24px] w-full" ><span>History</span></li>

          <li class="flex"><img src="https://res.cloudinary.com/vyomyquu/image/upload/v1790784302/Group_72_jlk7il.png" class="max-w-[30px] w-full" ><span>Rewards</span></li>

          <li class="flex"><img src="https://res.cloudinary.com/vyomyquu/image/upload/v1790784302/reicon_profile_coza0b.png" class="max-w-[28px] w-full" ><span>Profile</span></li>
        </ul>
      </div>

    </aside>
  </div>
</body>
</html>
