<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <title>Document</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-[#F2FAF5]">
  <div class="flex">

  <aside class="max-w-[374px] w-full min-h-screen bg-gradient-to-b from-transparent via-[#E8F6EE]/80 to-[#E8F6EE] p-6 relative z-10 shadow-[0_1px_3px_rgba(0,0,0,0.30)] ">

      <!-- LOGO -->

      <a href="index.html" class="flex items-center">
        <img src="https://res.cloudinary.com/vyomyquu/image/upload/v1790626204/RecycleConnect_Logo_1_dq4b8w.png" alt="Recycle Connect logo">
        <h2 class="font-[Montserrat] font-bold text-[24px] text-[#077053]">Recycle</h2>
        <span class="font-[Montserrat] text-[24px] text-[#077053]">Connect</span>
      </a>

      <!-- BUTTONS -->
      <div class="mt-18">
        <ul class="flex flex-col gap-4">
          <li data-href="House-Dashboard.html" class="flex gap-2 items-center rounded p-2 h-[60px] hover:border hover:border-[#D8E5DE] hover:shadow-lg hover:shadow-[#087a55] cursor-pointer"><img src="https://res.cloudinary.com/vyomyquu/image/upload/v1790784302/Group_1_h4envp.png" class="max-w-[18px] w-full rounded " ><span class="text-[#087A55] font-[Inter] font-semibold text-[16px] leading-[100%]">Home</span></li>

          <li data-href="House-Request.html" class="flex items-center gap-2 rounded p-2 h-[60px] hover:border hover:border-[#D8E5DE] hover:shadow-lg hover:shadow-[#087a55] cursor-pointer"><img src="https://res.cloudinary.com/vyomyquu/image/upload/v1790784302/boxicons_pickup-truck_mhaoya.png" class="max-w-[18px] w-full rounded"><span class="text-[#087A55] font-[Inter] font-semibold text-[16px] leading-[100%]" >Request Pickup</span></li>

          <li data-href="Collector.html" class="flex items-center gap-2 rounded p-2 h-[60px] hover:border hover:border-[#D8E5DE] hover:shadow-lg hover:shadow-[#087a55] cursor-pointer"><img src="https://res.cloudinary.com/vyomyquu/image/upload/v1790793348/Group_2_fdnpvu.png" class="max-w-[18px] w-full rounded"><span class="text-[#087A55] font-[Inter] font-semibold text-[16px] leading-[100%]">Become A Collector</span></li>

          <li data-href="PickUp-History.html" class="flex items-center gap-1 rounded p-2 h-[60px] hover:border hover:border-[#D8E5DE] hover:shadow-lg hover:shadow-[#087a55] cursor-pointer"><img src="https://res.cloudinary.com/vyomyquu/image/upload/v1790784302/Group_71_hjvsub.png" class="max-w-[24px] w-full rounded" ><span class="text-[#087A55] font-[Inter] font-semibold text-[16px] leading-[100%]">History</span></li>

          <li data-href="Collector-Reward.html" class="flex items-center gap-1 rounded p-2 h-[60px] hover:border hover:border-[#D8E5DE] hover:shadow-lg hover:shadow-[#087a55] cursor-pointer"><img src="https://res.cloudinary.com/vyomyquu/image/upload/v1791402532/iconmind_anniversary-reward-duotone-thin_bpclry.png" class="max-w-[22px] w-full rounded" ><span class="text-[#087A55] font-[Inter] font-semibold text-[16px] leading-[100%]">Rewards</span></li>

          <li data-href=".html" class="flex items-center gap-1 rounded p-2 h-[60px] hover:border hover:border-[#D8E5DE] hover:shadow-lg hover:shadow-[#087a55] cursor-pointer"><img src="https://res.cloudinary.com/vyomyquu/image/upload/v1790784302/reicon_profile_coza0b.png" class="max-w-[22px] w-full rounded" ><span class="text-[#087A55] font-[Inter] font-semibold text-[16px] leading-[100%]">Profile</span></li>
        </ul>
      </div>
    </aside>

    <main class=" w-full">

      <!-- HEADER  -->

      <section>
        <nav class="flex justify-end items-center p-4 ">
          <div class="flex gap-4 items-center">
            <img src="https://res.cloudinary.com/vyomyquu/image/upload/v1790869410/Group_80_oc9fch.png" class="w-[16px] h-[21px] cursor-pointer">
            <img src="https://res.cloudinary.com/vyomyquu/image/upload/v1790869411/Ellipse_8_ushlu2.png" class="max-w-[60px] w-full max-h-[60px] h-full rounded-full">
            <p class="text-[#043C2D] font-[Inter]">Lilian</p>
            <img src="https://res.cloudinary.com/vyomyquu/image/upload/v1790869410/Vector_12_xya2l8.png" class="w-[14px] h-[6px] cursor-pointer">
          </div>
        </nav>
      </section>

      <!-- MAIN CONTENT -->

      <section class="px-40 flex flex-col justify-center items-center gap-3">
        <div>
          <img src="https://res.cloudinary.com/vyomyquu/image/upload/v1791493733/Group_141_bbgigt.png" alt="Sucess image">
        </div>

        <div class="flex flex-col justify-center">
          <h1 class="text-center font-[Inter] font-bold text-[40px] mt-4">
           Order Received!
          </h1>
          <p class="text-center text-[#07543E] font-[Inter] text-[18px]">
           We've sent your request to nearby collectors
          </p>          
        </div>

        <!-- ORDER DETAILS  -->

        <div class="flex flex-col w-[600px] bg-white px-8 py-4 text-[#07543E] font-[Inter] rounded-[12px] gap-3">

        <div class="flex justify-between">
          <p>Order no.</p>
          <p class="font-bold">#RC-6542</p>
        </div>

        <div class="flex justify-between">
          <p>Material</p>
          <p class="font-bold">Plastic, 5.5kg</p>
        </div>

        <div class="flex justify-between">
          <p>Status</p>
          <p class="font-bold">Waiting for a collector</p>
        </div>
        </div>

        <button class="bg-[#087A55] w-full h-[68px] text-white text-[20px] font-semibold rounded-[12px] mt-10">
          Continue
        </button>
      </section>
    </main>
    </div>
</body>
</html>
