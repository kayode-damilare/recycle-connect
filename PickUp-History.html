<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pick Up History | RecycleConnect</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body class="min-h-screen bg-[#f7fcf9] pb-20 text-gray-800 md:pb-0">
    <div class="flex min-h-screen">
      <!-- SIDEBAR -->
      <aside
        class="fixed inset-x-0 bottom-0 z-50 border-t border-gray-100 bg-[#eaf8f1] md:sticky md:top-0 md:h-screen md:w-[84px] md:shrink-0 md:border-r lg:w-[250px]"
      >
        <div
          class="hidden items-center justify-center px-4 py-6 md:flex lg:justify-start lg:px-6"
        >
          <a href="./index.html" class="flex items-center gap-2">
            <img
              src="https://res.cloudinary.com/vyomyquu/image/upload/v1790626204/RecycleConnect_Logo_1_dq4b8w.png"
              alt="Recycle Connect logo"
              class="h-8 w-8"
            />
            <span
              class="hidden whitespace-nowrap font-[Montserrat] text-[18px] text-[#077053] lg:block"
            >
              <b>Recycle</b>Connect
            </span>
          </a>
        </div>

        <nav class="px-2 py-1 text-sm md:mt-6 md:px-3 lg:mt-10 lg:px-6">
          <ul class="flex justify-around md:flex-col md:justify-start md:gap-2">
            <li>
              <a
                href="./House-Dashboard.html"
                class="flex flex-col items-center justify-center gap-1 rounded p-2 hover:border hover:border-[#D8E5DE] hover:shadow-lg md:h-[60px] lg:flex-row lg:justify-start lg:gap-2"
              >
                <img
                  src="https://res.cloudinary.com/vyomyquu/image/upload/v1790784302/Group_1_h4envp.png"
                  class="w-[18px] rounded"
                  alt=""
                />
                <span
                  class="font-[Inter] text-[10px] font-semibold text-[#087A55] md:hidden lg:inline lg:text-[16px]"
                  >Home</span
                >
              </a>
            </li>

            <li>
              <a
                href="./House-Request.html"
                class="flex flex-col items-center justify-center gap-1 rounded p-2 hover:border hover:border-[#D8E5DE] hover:shadow-lg md:h-[60px] lg:flex-row lg:justify-start lg:gap-2"
              >
                <img
                  src="https://res.cloudinary.com/vyomyquu/image/upload/v1790784302/boxicons_pickup-truck_mhaoya.png"
                  class="w-[18px] rounded"
                  alt=""
                />
                <span
                  class="font-[Inter] text-[10px] font-semibold text-[#087A55] md:hidden lg:inline lg:text-[16px]"
                  >Request Pickup</span
                >
              </a>
            </li>

            <li>
              <a
                href="./Collector.html"
                class="flex flex-col items-center justify-center gap-1 rounded p-2 hover:border hover:border-[#D8E5DE] hover:shadow-lg md:h-[60px] lg:flex-row lg:justify-start lg:gap-2"
              >
                <img
                  src="https://res.cloudinary.com/vyomyquu/image/upload/v1790793348/Group_2_fdnpvu.png"
                  class="w-[18px] rounded"
                  alt=""
                />
                <span
                  class="font-[Inter] text-[10px] font-semibold text-[#087A55] md:hidden lg:inline lg:text-[16px]"
                  >Become A Collector</span
                >
              </a>
            </li>

            <li>
              <a
                href="./PickUp-History.html"
                aria-current="page"
                class="flex flex-col items-center justify-center gap-1 rounded bg-[#D1FFE3] p-2 md:h-[60px] lg:flex-row lg:justify-start lg:gap-2"
              >
                <img
                  src="https://res.cloudinary.com/vyomyquu/image/upload/v1790784302/Group_71_hjvsub.png"
                  class="w-[22px] rounded"
                  alt=""
                />
                <span
                  class="font-[Inter] text-[10px] font-semibold text-[#087A55] md:hidden lg:inline lg:text-[16px]"
                  >History</span
                >
              </a>
            </li>

            <li>
              <a
                href="./Collector-Reward.html"
                class="flex flex-col items-center justify-center gap-1 rounded p-2 hover:border hover:border-[#D8E5DE] hover:shadow-lg md:h-[60px] lg:flex-row lg:justify-start lg:gap-2"
              >
                <img
                  src="https://res.cloudinary.com/vyomyquu/image/upload/v1791402532/iconmind_anniversary-reward-duotone-thin_bpclry.png"
                  class="w-[22px] rounded"
                  alt=""
                />
                <span
                  class="font-[Inter] text-[10px] font-semibold text-[#087A55] md:hidden lg:inline lg:text-[16px]"
                  >Rewards</span
                >
              </a>
            </li>

            <li>
              <a
                href="./Profile.html"
                class="flex flex-col items-center justify-center gap-1 rounded p-2 hover:border hover:border-[#D8E5DE] hover:shadow-lg md:h-[60px] lg:flex-row lg:justify-start lg:gap-2"
              >
                <img
                  src="https://res.cloudinary.com/vyomyquu/image/upload/v1790784302/reicon_profile_coza0b.png"
                  class="w-[22px] rounded"
                  alt=""
                />
                <span
                  class="font-[Inter] text-[10px] font-semibold text-[#087A55] md:hidden lg:inline lg:text-[16px]"
                  >Profile</span
                >
              </a>
            </li>
          </ul>
        </nav>
      </aside>

      <!-- MAIN CONTENT -->
      <div class="min-w-0 flex-1">
        <header
          class="flex h-16 items-center justify-between gap-3 border-b border-green-100 bg-[#f7fcf9] px-4 sm:px-5 md:justify-end md:px-10"
        >
          <a href="./index.html" class="flex items-center md:hidden">
            <img
              src="https://res.cloudinary.com/vyomyquu/image/upload/v1790626204/RecycleConnect_Logo_1_dq4b8w.png"
              alt="Recycle Connect logo"
              class="h-7 w-7"
            />
            <span class="font-[Montserrat] text-[18px] font-bold text-[#077053]"
              >Recycle<span class="font-normal">Connect</span></span
            >
          </a>

          <div class="flex items-center gap-3">
            <img
              class="h-4 w-4"
              src="https://res.cloudinary.com/hesd0s4y/image/upload/v1790869712/bells_ik9zmk.png"
              alt="Notifications"
            />
            <img
              class="h-8 w-8 rounded-full object-cover"
              src="https://res.cloudinary.com/hesd0s4y/image/upload/v1790869726/avatar_hnfqe5.png"
              alt="User profile"
            />
            <p
              class="hidden font-[Inter] text-[16px] font-medium text-gray-700 sm:block"
            >
              Lilian
            </p>
            <img
              class="h-3 w-3"
              src="https://res.cloudinary.com/hesd0s4y/image/upload/v1790869745/chevron_wnxprc.svg"
              alt=""
            />
          </div>
        </header>

        <main class="px-4 py-5 sm:px-5 md:px-10 md:py-8">
          <h1
            class="font-[Inter] text-[24px] font-bold text-[#087A55] md:text-[28px] lg:text-[32px]"
          >
            Pick Up History
          </h1>

          <!-- FILTERS -->
          <div
            class="mt-4 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between"
          >
            <div
              class="flex gap-2 overflow-x-auto font-[Inter] text-[14px] sm:gap-4 md:text-[16px]"
            >
              <button
                type="button"
                data-filter="all"
                aria-pressed="true"
                class="shrink-0 rounded-lg bg-[#077053] px-4 py-3 font-semibold text-white shadow-sm sm:px-6"
              >
                All
              </button>

              <button
                type="button"
                data-filter="ongoing"
                aria-pressed="false"
                class="shrink-0 rounded-lg border border-green-100 bg-white/60 px-4 py-3 font-semibold text-[#077053] shadow-sm sm:px-6"
              >
                Ongoing
              </button>

              <button
                type="button"
                data-filter="completed"
                aria-pressed="false"
                class="shrink-0 rounded-lg border border-green-100 bg-white/60 px-4 py-3 font-semibold text-[#077053] shadow-sm sm:px-6"
              >
                Completed
              </button>
            </div>

            <div
              class="flex w-full items-center gap-2 rounded-lg border border-green-100 bg-white px-3 py-3 shadow-sm sm:w-56 lg:w-64"
            >
              <img
                class="h-[18px] w-[18px]"
                src="https://res.cloudinary.com/hesd0s4y/image/upload/v1790868014/akar-icons_search_xz0iwc.png"
                alt=""
              />
              <input
                id="pickup-search"
                type="search"
                placeholder="Search pickups"
                class="min-w-0 flex-1 font-[Inter] text-[14px] outline-none placeholder:text-gray-400"
              />
            </div>
          </div>

          <!-- JAVASCRIPT WILL RENDER THE PICKUP CARDS HERE -->
          <section
            id="pickup-list"
            aria-live="polite"
            aria-busy="true"
            class="mt-4"
          >
            <p class="mt-6 text-center font-[Inter] text-[16px] text-[#898484]">
              Loading pickup history...
            </p>
          </section>
        </main>
      </div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
